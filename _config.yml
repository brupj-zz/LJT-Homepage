# Site settings
title: Junteng Liu
description: >-
  Personal homepage of Junteng Liu, first-year PhD candidate at HKUST NLP Group.
baseurl: ""
url: "https://brupj-zz.github.io"

# Build settings
markdown: kramdown
remote_theme: "academicpages/academicpages.github.io@master"

# Theme settings
theme: minimal-mistakes-jekyll

# Minimal Mistakes default settings
minimal_mistakes_skin: "default"

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Author information
author:
  name: "Junteng Liu"
  email: "jliugi@connect.ust.hk"
  github: "Vicent0205"
  scholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  twitter: "junteng88716710"
  bio: "First-year PhD candidate at HKUST NLP Group."
  location: "Hong Kong"

# Social links
social:
  github: "Vicent0205"
  scholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  twitter: "junteng88716710"

# Default settings
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "single"

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Reading files
exclude:
  - /vendor/
  - /node_modules/
  - /docs/
  - /scripts/
  - /Gemfile
  - /Gemfile.lock
  - /package.json
  - /Dockerfile
  - /docker-compose.yaml
  - /.devcontainer/
  - /talkmap.ipynb
  - /talkmap.py
  - /talkmap_out.ipynb
  - /.github/

# Permalinks
permalink: /:year/:month/:day/:title/

# Output
timezone: Asia/Hong_Kong

# Atom feed
atom_feed:
  path: /feed.xml

# Analytics
google_analytics:
  id:
  anonymize_ip: false

# Comments
comments:
  provider: false
